<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đi y chang</title>
<style>
:root{--bg:#000;--sf:#121212;--sf2:#1e1e1e;--ln:#2a2a2a;--tx:#fff;--mu:#8a8a8a;--ac:#fe2c55;--ok:#25d366;--wa:#f5a623;--ra:12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0a0a0a;color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
.phone{width:390px;height:844px;max-height:calc(100vh - 32px);background:var(--bg);border-radius:44px;border:10px solid #1a1a1a;position:relative;overflow:hidden}
@media (max-width:480px){.wrap{padding:0}.phone{width:100vw;height:100vh;max-height:none;border:0;border-radius:0}}
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.view{flex:1;position:relative;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.mu{color:var(--mu)} .sm{font-size:13px} .xs{font-size:12px} .b{font-weight:600}
.ok{color:var(--ok)} .wa{color:var(--wa)} .ac{color:var(--ac)}
.sim{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.08em;color:rgba(255,255,255,.45);z-index:30;pointer-events:none}

/* bottom nav */
.nav{height:56px;display:flex;align-items:center;justify-content:space-around;border-top:1px solid #111;background:var(--bg);font-size:12px}
.nav button{color:var(--mu);flex:1;height:100%}
.nav button.on{color:var(--tx);font-weight:600}
.nav .plus{flex:none;width:44px;height:28px;border-radius:8px;background:var(--tx);color:#000;font-size:20px;line-height:28px;font-weight:700;box-shadow:-3px 0 0 #25f4ee,3px 0 0 var(--ac)}

/* feed */
.feed{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.post{height:100%;scroll-snap-align:start;position:relative;overflow:hidden}
.bgv{position:absolute;inset:-10%;animation:kb 14s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.12) translate(-3%,-2%)}}
.shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.35),transparent 25%,transparent 50%,rgba(0,0,0,.75))}
.top{position:absolute;top:34px;left:0;right:0;display:flex;justify-content:center;gap:18px;font-size:16px;z-index:5}
.top span{color:rgba(255,255,255,.6)} .top span.on{color:#fff;font-weight:700;border-bottom:2px solid #fff;padding-bottom:4px}
.rail{position:absolute;right:10px;bottom:150px;display:flex;flex-direction:column;align-items:center;gap:18px;z-index:5}
.rail button{display:flex;flex-direction:column;align-items:center;font-size:12px;gap:2px}
.rail svg{width:30px;height:30px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.rail .liked svg{fill:var(--ac);stroke:var(--ac)}
.rail .saved svg{fill:#fbc531;stroke:#fbc531}
.avatar{width:44px;height:44px;border-radius:50%;border:2px solid #fff;background:#444;display:flex;align-items:center;justify-content:center;font-weight:700}
.meta{position:absolute;left:14px;right:72px;bottom:72px;z-index:5}
.chap{font-size:12px;color:rgba(255,255,255,.85);margin-bottom:6px}
.tagp{display:inline-block;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);padding:4px 10px;border-radius:6px;font-size:13px;font-weight:600;margin-bottom:8px}
.author{font-weight:700} .vf{font-size:12px;color:#7ee2a8;margin-left:6px;font-weight:500}
.cap{margin:4px 0;font-size:14px}
.why{font-size:12px;color:rgba(255,255,255,.75)}
.prog{position:absolute;left:0;right:0;bottom:62px;height:2px;display:flex;gap:2px;padding:0 0;z-index:5}
.prog i{flex:1;background:rgba(255,255,255,.25);position:relative;overflow:hidden}
.prog i b{position:absolute;inset:0;width:0;background:#fff}
.cta{position:absolute;left:14px;right:14px;bottom:12px;display:flex;gap:8px;z-index:5}
.cta button{flex:1;height:40px;border-radius:8px;font-weight:600;font-size:14px}
.btn-ghost{background:rgba(255,255,255,.16);backdrop-filter:blur(6px)}
.btn-ac{background:var(--ac);color:#fff}
.btn-w{background:#fff;color:#000}

/* sheet */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:flex-end}
.sheet{width:100%;max-height:78%;background:var(--sf);border-radius:14px 14px 0 0;padding:10px 16px 16px;overflow:auto}
.grab{width:36px;height:4px;border-radius:2px;background:#444;margin:0 auto 10px}
.dh{font-size:12px;color:var(--mu);margin:14px 0 4px;text-transform:uppercase;letter-spacing:.06em}
.it{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--ln);font-size:14px}
.it .t{width:56px;flex:none;color:var(--mu);font-size:12px;padding-top:2px}
.it .s{flex:1}
.note{font-size:12px;color:var(--mu);margin-top:2px}

/* pages */
.page{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:20}
.hdr{height:52px;padding-top:6px;display:flex;align-items:center;gap:10px;padding-left:12px;padding-right:12px;border-bottom:1px solid #111;flex:none}
.hdr .back{font-size:22px;width:28px}
.hdr .ti{font-weight:700;flex:1;text-align:center;margin-right:28px}
.body{flex:1;overflow:auto;padding:12px 16px 16px}
.foot{flex:none;border-top:1px solid #1a1a1a;padding:10px 16px 14px;background:var(--bg)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.seg{display:flex;background:var(--sf2);border-radius:8px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 0;border-radius:6px;font-size:13px;color:var(--mu)}
.seg button.on{background:#333;color:#fff;font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:99px;background:var(--sf2);font-size:13px;color:#ddd;border:1px solid transparent}
.chip.on{border-color:#fff;color:#fff;font-weight:600}
.chip small{display:block;font-size:11px;color:var(--mu)}
.lbl{font-size:12px;color:var(--mu);margin:14px 0 6px}
.step{display:flex;align-items:center;gap:14px}
.step button{width:30px;height:30px;border-radius:50%;background:var(--sf2);font-size:18px}
.card{background:var(--sf);border-radius:var(--ra);padding:12px;margin:8px 0}
.card.off{opacity:.4}
.alert{background:rgba(245,166,35,.12);border-radius:10px;padding:10px;font-size:13px;margin-top:8px}
.alert .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.alert .acts button{background:#2a2a2a;padding:6px 10px;border-radius:6px;font-size:12px}
.tog{width:40px;height:24px;border-radius:12px;background:#333;position:relative;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#888;transition:.15s}
.tog.on{background:var(--ac)} .tog.on::after{left:19px;background:#fff}
.big{width:100%;height:48px;border-radius:10px;font-weight:700;font-size:15px}
.big:disabled{opacity:.4}
.tot{font-size:20px;font-weight:700}
.line{display:flex;justify-content:space-between;font-size:14px;padding:6px 0}
.hr{height:1px;background:var(--ln);margin:6px 0}
input[type=text],textarea{width:100%;background:var(--sf2);border:0;border-radius:8px;color:#fff;padding:12px;font:inherit}
textarea{min-height:80px;resize:none}
.thumb{height:220px;border-radius:12px;position:relative;overflow:hidden;margin:6px 0}
.thumb .lab{position:absolute;left:10px;bottom:10px;font-size:12px;background:rgba(0,0,0,.5);padding:3px 8px;border-radius:6px}
.blurbox{position:absolute;width:44px;height:44px;border-radius:50%;border:2px dashed #fff;background:rgba(255,255,255,.15)}
.blurbox.done{border-style:solid;backdrop-filter:blur(8px);background:rgba(120,120,120,.6)}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:100%;padding:24px}
.check{width:64px;height:64px;border-radius:50%;background:var(--ok);display:flex;align-items:center;justify-content:center;font-size:32px;color:#000;margin-bottom:14px}
.dots{display:flex;gap:4px;justify-content:center;margin:4px 0 10px}
.dots i{width:18px;height:3px;border-radius:2px;background:#333}
.dots i.on{background:#fff}
.toast{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(40,40,40,.95);padding:10px 14px;border-radius:8px;font-size:13px;z-index:60;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap"><div class="phone"><div class="app" id="app"></div><div class="sim">BẢN MÔ PHỎNG</div></div></div>
<script>
/* ---------- data (mô phỏng) ---------- */
const VND=n=>n.toLocaleString('vi-VN')+'đ';
const DATES=[{l:'15/11',f:1.00,vwOut:true},{l:'22/11',f:0.82},{l:'29/11',f:0.90},{l:'06/12',f:1.25}];
const ORI={SGN:{n:'Sài Gòn',c:'SGN',p:1290000,o:'07:45',r:'18:30'},HAN:{n:'Hà Nội',c:'HAN',p:1650000,o:'07:30',r:'18:00'},DAD:{n:'Đà Nẵng',c:'DAD',p:0}};
const HOTEL=2950000,VW=950000,SAF=650000,USUAL=0.9;
const POSTS=[
 {id:'pq',u:'linh.dichoi',ini:'L',cap:'Phú Quốc 3N2Đ chill hết nấc',where:'Sóng Xanh Resort Phú Quốc',why:'32 người lưu trong 24h',likes:1240,cmt:86,season:'Hè 2026',lv:'Đã đi thật',
  bg:'linear-gradient(160deg,#0b7285,#1864ab 45%,#e67700)',chaps:['Ngày 1 · Bay đến Phú Quốc','Ngày 1 · Sóng Xanh Resort','Ngày 2 · Công viên Đảo Ngọc','Ngày 2 · Phố Hoàng Hôn','Ngày 3 · Bay về'],itin:true},
 {id:'tx',u:'khoa.travel',ini:'K',cap:'Săn mây Tà Xùa 2N1Đ, xe giường nằm từ Hà Nội',where:'Mây Homestay Tà Xùa',why:'5 người đã đi theo tuần này',likes:860,cmt:41,season:'Thu 2026',lv:'Đã đặt chỗ',
  bg:'linear-gradient(175deg,#495057,#868e96 40%,#dee2e6 75%,#f59f00)',chaps:['Ngày 1 · Xe khách lên Bắc Yên','Ngày 1 · Mây Homestay','Ngày 2 · Sống lưng khủng long'],itin:false},
 {id:'ha',u:'mai.slow',ini:'M',cap:'Góc cà phê view sông, Hội An mùa mưa',where:'Cà phê Hiên Nhà, Hội An',why:'Đang được bàn tán ở Hội An',likes:530,cmt:22,season:'Đông 2025',lv:'Có mặt tại chỗ',
  bg:'linear-gradient(165deg,#2b8a3e,#5c940d 50%,#e8590c)',chaps:['Phố cổ','Hiên Nhà'],itin:false}
];
const S={tab:'home',liked:{},saved:{},sheet:null,page:null,origin:'SGN',date:1,ppl:2,inc:{fly:true,hotel:true,vw:true,sun:true},vwAlt:false,ftab:'plan',
  policy:'keep',login:false,stays:[],claim:{m:null,shown:0},paid:false,paying:false,trips:[],cp:{step:0,blur:false,sp:null,cap:'',sun:true,note:true},myPost:false};

function calc(){
  const d=DATES[S.date],o=ORI[S.origin],rooms=Math.ceil(S.ppl/2),fOk=o.p>0;
  const fp=Math.round(o.p*d.f/1000)*1000, hn=Math.round(HOTEL*d.f/1000)*1000;
  const vwOut=d.vwOut&&!S.vwAlt, vp=S.vwAlt?SAF:VW;
  const fly=S.inc.fly&&fOk?fp*2*S.ppl:0, hotel=S.inc.hotel?hn*rooms*2:0, vw=S.inc.vw&&!vwOut?vp*S.ppl:0;
  const usual=(S.inc.fly&&fOk?Math.round(o.p*USUAL/1000)*1000*2*S.ppl:0)+(S.inc.hotel?Math.round(HOTEL*USUAL/1000)*1000*rooms*2:0)+vw;
  const total=fly+hotel+vw;
  return {d,o,rooms,fOk,fp,hn,vwOut,vp,fly,hotel,vw,total,diff:usual?(total-usual)/usual:0};
}
function fromPrice(){let b=1e12;DATES.forEach(d=>{if(d.vwOut)return;const t=(Math.round(ORI.SGN.p*d.f/1000)*1000*4+Math.round(HOTEL*d.f/1000)*1000*2+VW*2)/2;b=Math.min(b,t)});return (Math.round(b/100000)/10).toLocaleString('vi-VN')+'tr'}
function day(i){const [d,m]=DATES[S.date].l.split('/').map(Number);const x=new Date(2026,m-1,d+i);return x.getDate()+'/'+(x.getMonth()+1)}

/* ---------- icons (chỉ dùng ở thanh bên) ---------- */
const I={
 heart:'<svg viewBox="0 0 24 24" fill="#fff" stroke="#fff" stroke-width="1"><path d="M12 21s-7.5-4.6-9.5-9.2C1 8.2 3.4 4.5 7 4.5c2 0 3.3 1 5 3 1.7-2 3-3 5-3 3.6 0 6 3.7 4.5 7.3C19.5 16.4 12 21 12 21z"/></svg>',
 cmt:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3C6.5 3 2 6.8 2 11.5c0 2.6 1.4 4.9 3.6 6.5L5 21.5l4-2.2c1 .3 2 .4 3 .4 5.5 0 10-3.8 10-8.5S17.5 3 12 3z"/></svg>',
 save:'<svg viewBox="0 0 24 24" fill="#fff" stroke="#fff"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
 share:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M14 4l8 8-8 8v-5c-6 0-9.5 2-12 6 .8-6 4-11 12-12z"/></svg>'
};

/* ---------- render ---------- */
const $=s=>document.querySelector(s); let timer=null;
function render(){
  clearInterval(timer);
  let h=`<div class="view">${S.tab==='home'?feed():S.tab==='trips'?trips():S.tab==='me'?me():feed()}</div>${nav()}`;
  if(S.sheet==='itin') h+=itinSheet();
  if(S.sheet==='login') h+=loginSheet();
  if(S.page==='follow') h+=follow();
  if(S.page==='pay') h+=pay();
  if(S.page==='done') h+=done();
  if(S.page==='create') h+=create();
  if(S.page==='claim') h+=claim();
  $('#app').innerHTML=h;
  if(S.tab==='home'&&!S.page) animate();
}
function nav(){
  const b=(k,t)=>`<button class="${S.tab===k?'on':''}" onclick="S.tab='${k}';S.page=null;S.sheet=null;render()">${t}</button>`;
  return `<div class="nav">${b('home','Trang chủ')}${b('explore','Khám phá')}<button style="flex:1" onclick="S.page='create';S.cp.step=0;render()"><span class="plus" style="display:inline-block">+</span></button>${b('trips','Chuyến đi')}${b('me','Tôi')}</div>`;
}
function feed(){
  const list=(S.myPost?[{...POSTS[0],id:'mine',u:'khang.di',ini:'K',cap:S.cp.cap||'Phú Quốc y chang Linh, đỉnh thật',why:'Bài của bạn · vừa đăng',likes:0,cmt:0,season:'Thu 2026'}]:[]).concat(POSTS);
  return `<div class="top"><span>Khám phá</span><span class="on">Dành cho bạn</span></div><div class="feed" id="feed">`+list.map((p,i)=>`
   <section class="post">
    <div class="bgv" style="background:${p.bg}"></div><div class="shade"></div>
    <div class="rail">
      <div class="avatar">${p.ini}</div>
      <button class="${S.liked[p.id]?'liked':''}" onclick="like('${p.id}')">${I.heart}<span>${fmt(p.likes+(S.liked[p.id]?1:0))}</span></button>
      <button onclick="toast('Bình luận')">${I.cmt}<span>${p.cmt}</span></button>
      <button class="${S.saved[p.id]?'saved':''}" onclick="save('${p.id}')">${I.save}<span>${S.saved[p.id]?'Đã lưu':'Lưu'}</span></button>
      <button onclick="toast('Đã sao chép liên kết')">${I.share}<span>Chia sẻ</span></button>
    </div>
    <div class="meta">
      <div class="chap" data-chaps='${JSON.stringify(p.chaps)}'>${p.chaps[0]}</div>
      <div class="tagp">${p.where}</div>
      <div><span class="author">@${p.u}</span><span class="vf" style="${p.lv==='Có mặt tại chỗ'?'color:#ccc':p.lv==='Đã đặt chỗ'?'color:#9fd3ff':''}">${p.lv} · ${p.season}</span></div>
      <div class="cap">${p.cap}</div>
      <div class="why">${p.why}${p.itin?' · Từ ~'+fromPrice()+'/người':''}</div>
    </div>
    <div class="prog">${p.chaps.map(()=>'<i><b></b></i>').join('')}</div>
    <div class="cta">${p.itin?`<button class="btn-ghost" onclick="S.sheet='itin';render()">Lộ trình</button><button class="btn-ac" onclick="openFollow()">Đi y chang</button>`:`<button class="btn-ghost" onclick="toast('Bài này không kèm lộ trình')">Xem chỗ này</button>`}</div>
   </section>`).join('')+`</div>`;
}
function fmt(n){return n>=1000?(n/1000).toFixed(1).replace('.',',')+'k':n}
function animate(){
  let t=0; timer=setInterval(()=>{t=(t+1)%300;
    document.querySelectorAll('.post').forEach(p=>{const ch=p.querySelector('.chap');const arr=JSON.parse(ch.dataset.chaps);const seg=Math.min(arr.length-1,Math.floor(t/300*arr.length));
      ch.textContent=arr[seg];p.querySelectorAll('.prog b').forEach((b,k)=>b.style.width=(k<seg?100:k===seg?((t/300*arr.length)%1)*100:0)+'%');});},60);
}
function like(id){S.liked[id]=!S.liked[id];render()}
function save(id){S.saved[id]=!S.saved[id];render();toast(S.saved[id]?'Đã lưu vào Chuyến đi':'Đã bỏ lưu')}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;$('#app').appendChild(e);setTimeout(()=>e.remove(),1400)}

function itinSheet(){return `<div class="dim" onclick="if(event.target===this){S.sheet=null;render()}"><div class="sheet"><div class="grab"></div>
  <div class="row"><div class="b">Lộ trình 3 ngày 2 đêm</div><span class="xs ok">Đã đi thật</span></div>
  <div class="dh">Ngày 1</div>
  <div class="it"><span class="t">Sáng</span><span class="s">Bay đến Phú Quốc<div class="note">Chặng bay đổi theo nơi bạn ở</div></span></div>
  <div class="it"><span class="t">Chiều</span><span class="s">Sóng Xanh Resort Phú Quốc · Deluxe hướng biển · 2 đêm<div class="note">"Xin tầng cao, view hoàng hôn đỉnh"</div></span></div>
  <div class="it"><span class="t">Tối</span><span class="s">Phố Hoàng Hôn<div class="note">Gợi ý ghé · không đặt trong app</div></span></div>
  <div class="dh">Ngày 2</div>
  <div class="it"><span class="t">Cả ngày</span><span class="s">Công viên Đảo Ngọc<div class="note">"Vào lúc 9h cho vắng"</div></span></div>
  <div class="dh">Ngày 3</div>
  <div class="it"><span class="t">Tối</span><span class="s">Bay về</span></div>
  <div class="card sm" style="margin-top:12px"><div class="b" style="margin-bottom:4px">14 người đã đi nói gì</div><div>View biển đẹp, phòng sạch</div><div class="mu">Cuối tuần Công viên Đảo Ngọc khá đông</div></div>
  <button class="big btn-ac" style="margin-top:6px" onclick="S.sheet=null;openFollow()">Đi y chang</button></div></div>`}

function openFollow(){S.page='follow';S.paid=false;render()}
function follow(){
  const c=calc();
  const dates=DATES.map((d,i)=>{const lv=d.f<0.88?'Rẻ':d.f>1.1?'Cao':'TB';return `<button class="chip ${S.date===i?'on':''}" onclick="S.date=${i};render()">T7 ${d.l}<small>${lv}</small></button>`}).join('');
  const T=(k)=>`<div class="tog ${S.inc[k]?'on':''}" onclick="S.inc['${k}']=!S.inc['${k}'];render()"></div>`;
  const plan=`
   <div class="dh">Ngày 1 · ${day(0)}</div>
   <div class="card ${S.inc.fly&&c.fOk?'':'off'}"><div class="row"><div><div>${c.fOk?`${c.o.c} → PQC · ${c.o.o}`:'Chuyến bay đến PQC'}</div>
     <div class="xs mu">${c.fOk?`Khứ hồi · ${VND(c.fp)}/người/chiều`:''}</div></div>${T('fly')}</div>
     ${c.fOk?'':`<div class="alert">Chưa có chặng bay từ ${c.o.n} tới Phú Quốc. Bỏ mục bay hoặc chọn nơi đi khác.</div>`}</div>
   <div class="card ${S.inc.hotel?'':'off'}"><div class="row"><div><div>Sóng Xanh Resort Phú Quốc</div><div class="xs mu">Deluxe hướng biển · ${c.rooms} phòng · 2 đêm · ${VND(c.hn)}/đêm</div></div>${T('hotel')}</div>
     <div class="note">"Xin tầng cao, view hoàng hôn đỉnh" — Linh</div></div>
   <div class="card ${S.inc.sun?'':'off'}"><div class="row"><div><div>Phố Hoàng Hôn</div><div class="xs mu">Gợi ý ghé · không tính tiền</div></div>${T('sun')}</div></div>

function claim(){
  const c=S.claim, m=c.m&&CLAIMS[c.m];
  const back=`<div class="hdr"><button class="back" onclick="${c.m?"S.claim={m:null,shown:0,done:false}":"S.page=null"};render()">‹</button><div class="ti">Thêm chuyến đã đi</div></div>`;
  if(!m) return `<div class="page">${back}<div class="body">

    ${Object.keys(CLAIMS).map(k=>`<div class="card" onclick="startClaim('${k}')" style="cursor:pointer"><div class="b">${CLAIMS[k].t}</div><div class="sm mu">${CLAIMS[k].d}</div></div>`).join('')}
    <div class="xs mu" style="margin-top:10px">Ảnh chụp màn hình không được dùng làm bằng chứng. Nội dung email bị xóa sau khi kiểm tra.</div></div></div>`;
  const intro = c.m==='email'?`<div class="card"><div class="sm mu">Chuyển tiếp email xác nhận tới</div><div class="b">khang.di@verify.diychang.app</div></div>`

  const done=c.shown>=m.checks.length;
  return `<div class="page">${back}<div class="body"><div class="b" style="font-size:17px">${m.t}</div>${intro}
    ${m.checks.slice(0,c.shown).map(x=>`<div class="line"><span>${x}</span><span class="ok">✓</span></div>`).join('')}
    ${!done?`<div class="line mu"><span>Đang kiểm tra…</span></div>`:''}
    ${done&&m.stay?`<div class="card" style="margin-top:12px"><div class="b">${m.stay.place}</div><div class="sm mu">${m.stay.dates} · ${m.stay.src}</div>
        <div class="sm ${lvColor(c.lv)}" style="margin-top:4px">Mức xác minh: <b>${c.lv}</b></div>
        ${c.lv==='Đã đặt chỗ'?`<div class="alert">Đã có bằng chứng đặt chỗ. Thêm bằng chứng có mặt (vị trí khi đang ở đó, hoặc QR tại quầy) để lên <b>Đã đi thật</b>.<div class="acts"><button onclick="S.claim.lv='Đã đi thật';render()">Mô phỏng: đã ở trong vùng 3 lần</button></div></div>`:''}

    </div>${done?`<div class="foot"><button class="big btn-ac" onclick="saveClaim()">Lưu vào Chuyến đi</button></div>`:''}</div>`;
}
function startClaim(k){S.claim={m:k,shown:0,lv:CLAIMS[k].stay?CLAIMS[k].stay.lv:null};render();
  const tick=()=>{if(S.page!=='claim'||S.claim.m!==k)return; if(S.claim.shown<CLAIMS[k].checks.length){S.claim.shown++;render();setTimeout(tick,550)}}; setTimeout(tick,550)}
function saveClaim(){const m=CLAIMS[S.claim.m];
  if(m.stay) S.stays.unshift({...m.stay,lv:S.claim.lv});
  if(m.fly){const tx=S.stays.find(s=>s.place.includes('Tà Xùa')); if(tx) tx.fly=m.fly; else S.stays.unshift({place:'Chuyến bay '+m.fly,dates:'07/11',src:'Vé đặt trên web hãng',lv:'Chưa xác minh',fly:m.fly});}
  S.page=null;S.tab='trips';render();toast('Đã thêm vào Chuyến đi')}

function publish(){S.myPost=true;S.page=null;S.tab='home';render();toast('Đã đăng · đang được kiểm duyệt tự động')}

render();
</script>
