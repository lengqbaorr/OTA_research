<style>

.skel{height:12px;border-radius:4px;background:linear-gradient(90deg,#1e1e1e,#2a2a2a,#1e1e1e);background-size:200% 100%;animation:sk 1s linear infinite;margin-top:6px;width:60%}
@keyframes sk{to{background-position:-200% 0}}

</head>
<body>

<script>
/* =========================================================
   BẢN MÔ PHỎNG "ĐI NGAY"
   - Người đăng dựng lộ trình bằng các điểm (đi, ở, chơi, ăn), không cần xác minh.
   - Nút "Đi ngay": lớp AI (mô phỏng) hiểu yêu cầu → lớp luật tính chặng đi, giờ, giá,
     chỗ ở theo ngân sách → 3 phương án → đặt vé + chỗ ở trong app.
   - Mọi chặng, giá, tên chỗ đều là dữ liệu mô phỏng.
   ========================================================= */
const VND=n=>Math.round(n).toLocaleString('vi-VN')+'đ';
const tr=n=>(Math.round(n/100000)/10).toLocaleString('vi-VN')+'tr';
const DATES=[{l:'15/11',f:1.00},{l:'22/11',f:0.85},{l:'29/11',f:0.92},{l:'06/12',f:1.25}];
const CITY={SGN:'Sài Gòn',HAN:'Hà Nội',DAD:'Đà Nẵng',BY:'Bắc Yên',PQC:'Phú Quốc'};

/* Đồ thị phương tiện (mô phỏng). price: mỗi người. dyn: giá đổi theo ngày */
const LEGS=[
 {f:'SGN',t:'HAN',m:'Máy bay',deps:[6,9.5,13,19.5],dur:2.2,p:1450000,dyn:1,src:'api'},
 {f:'SGN',t:'HAN',m:'Tàu hỏa giường nằm',deps:[19],dur:33,p:1100000,src:'api'},
 {f:'DAD',t:'HAN',m:'Máy bay',deps:[7,15],dur:1.3,p:950000,dyn:1,src:'api'},
 {f:'HAN',t:'BY',m:'Limousine',deps:[7,13],dur:5,p:350000,src:'own'},
 {f:'HAN',t:'BY',m:'Xe giường nằm',deps:[21],dur:6,p:250000,src:'own'},
 {f:'HAN',t:'SGN',m:'Máy bay',deps:[7,12,18,21],dur:2.2,p:1450000,dyn:1,src:'api'},
 {f:'HAN',t:'SGN',m:'Tàu hỏa giường nằm',deps:[19.5],dur:33,p:1100000,src:'api'},
 {f:'HAN',t:'DAD',m:'Máy bay',deps:[10,19],dur:1.3,p:950000,dyn:1,src:'api'},
 {f:'BY',t:'HAN',m:'Limousine',deps:[8,14],dur:5,p:350000,src:'own'},
 {f:'BY',t:'HAN',m:'Xe giường nằm',deps:[20.5],dur:6,p:250000,src:'own'},
 {f:'SGN',t:'PQC',m:'Máy bay',deps:[6.5,10,15.5],dur:1,p:1290000,dyn:1,src:'api'},
 {f:'HAN',t:'PQC',m:'Máy bay',deps:[7.5,14],dur:2.2,p:1650000,dyn:1,src:'api'},
 {f:'PQC',t:'SGN',m:'Máy bay',deps:[11,18.5,21],dur:1,p:1290000,dyn:1,src:'api'},
 {f:'PQC',t:'HAN',m:'Máy bay',deps:[13,19],dur:2.2,p:1650000,dyn:1,src:'api'}
];
const DEST={
 tx:{name:'Tà Xùa',hub:'BY',nights:2,leaveAfter:12,last:{m:'Xe ôm Bắc Yên ⇄ Tà Xùa',dur:1,est:150000},origins:['SGN','HAN','DAD'],
  stays:[{id:'may',name:'Mây Homestay',sub:'Phòng view mây',p:650000,src:'own',poster:true},
         {id:'lodge',name:'Săn Mây Lodge',sub:'Phòng gỗ, cách 1 km',p:450000,src:'api'},
         {id:'cloud',name:'Cloud House Tà Xùa',sub:'Bungalow kính',p:950000,src:'api',out:[0]}]},
 pq:{name:'Phú Quốc',hub:'PQC',nights:2,leaveAfter:11,last:{m:'Taxi sân bay ⇄ chỗ ở',dur:0.5,est:80000},origins:['SGN','HAN','DAD'],
  stays:[{id:'sx',name:'Sóng Xanh Resort',sub:'Deluxe hướng biển',p:2950000,src:'api',poster:true},
         {id:'bb',name:'Biển Bạc Bungalow',sub:'Gần bãi Sao',p:1200000,src:'api'},
         {id:'hd',name:'Nhà Hàng Dương Homestay',sub:'Phòng đôi',p:600000,src:'own'}]}
};
const INV={may:{name:'Mây Homestay Tà Xùa',cap:4,booked:{'15/11':3,'22/11':1,'29/11':0,'6/12':4},stop:{},adj:0}};
const HOSTBOOK=[{who:'Trần M.',d:'15/11',n:'2 phòng',pay:'Trả tại homestay'},{who:'Lê H.',d:'15/11',n:'1 phòng',pay:'Trả trong app'}];

/* Lộ trình người đăng dựng (điểm) */
const ROUTES={
 tx:{title:'Tà Xùa 3N2Đ săn mây',author:'khoa.travel',dest:'tx',days:[
   [{t:'move',name:'Sài Gòn → Tà Xùa',note:'Mình bay ra Hà Nội rồi đi limousine lên Bắc Yên, xe ôm lên bản'},
    {t:'stay',name:'Mây Homestay',note:'Phòng view mây, nên đặt sớm'},
    {t:'eat',name:'Lẩu gà đen bản Mông',price:'250–400k/nhóm',km:0.6}],
   [{t:'play',name:'Sống lưng khủng long',note:'Đi 5h sáng để săn mây',price:'Miễn phí',km:4},
    {t:'eat',name:'Quán thắng cố cô Sinh',price:'60–100k/người',km:1.2},
    {t:'play',name:'Cây cô đơn',price:'20k vé',km:3}],
   [{t:'move',name:'Về',note:'Xuống núi trước trưa cho kịp xe'}]]},
 pq:{title:'Phú Quốc 3N2Đ chill',author:'linh.dichoi',dest:'pq',days:[
   [{t:'move',name:'Sài Gòn → Phú Quốc',note:'Bay sáng sớm cho kịp hoàng hôn'},
    {t:'stay',name:'Sóng Xanh Resort',note:'Xin tầng cao, view hoàng hôn'},
    {t:'eat',name:'Chợ đêm thị trấn',price:'150–300k/người',km:7}],
   [{t:'play',name:'Bãi Sao',price:'Miễn phí',km:18,note:'Nước trong nhất buổi sáng'},
    {t:'eat',name:'Quán bún quậy',price:'50–80k/người',km:6}],
   [{t:'move',name:'Về'}]]}
};

const POSTS=[
 {id:'tx',r:'tx',u:'khoa.travel',ini:'K',cap:'Săn mây Tà Xùa 3N2Đ, đi từ Sài Gòn',where:'Mây Homestay · Tà Xùa',why:'12 người đã đi theo · 4,6/5 khớp thực tế',likes:860,cmt:41,
  bg:'linear-gradient(175deg,#495057,#868e96 40%,#dee2e6 75%,#f59f00)',chaps:['Ngày 1 · Sài Gòn → Tà Xùa','Ngày 1 · Mây Homestay','Ngày 2 · Sống lưng khủng long','Ngày 2 · Cây cô đơn']},
 {id:'pq',r:'pq',u:'linh.dichoi',ini:'L',cap:'Phú Quốc 3N2Đ chill hết nấc',where:'Sóng Xanh Resort · Phú Quốc',why:'32 người lưu trong 24h',likes:1240,cmt:86,sponsored:true,
  bg:'linear-gradient(160deg,#0b7285,#1864ab 45%,#e67700)',chaps:['Ngày 1 · Bay đến Phú Quốc','Ngày 1 · Sóng Xanh Resort','Ngày 2 · Bãi Sao','Ngày 2 · Chợ đêm']},
 {id:'ha',u:'mai.slow',ini:'M',cap:'Góc cà phê view sông, Hội An mùa mưa',where:'Cà phê Hiên Nhà · Hội An',why:'Đang được bàn tán ở Hội An',likes:530,cmt:22,
  bg:'linear-gradient(165deg,#2b8a3e,#5c940d 50%,#e8590c)',chaps:['Phố cổ','Hiên Nhà']}
];

const S={tab:'home',liked:{},saved:{},sheet:null,sheetR:null,page:null,login:false,trips:[],myPost:false,
  g:null, cp:{step:1,blur:false,sp:null,cap:'',extra:0}, paying:false,payLog:[],result:null};

/* ---------- lớp LUẬT: lập phương án ---------- */
function dayLabel(off){const [d,m]=DATES[S.g.date].l.split('/').map(Number);const x=new Date(2026,m-1,d+Math.floor(off/24));return x.getDate()+'/'+(x.getMonth()+1)}
function hh(h){const x=((h%24)+24)%24;return String(Math.floor(x)).padStart(2,'0')+':'+String(Math.round((x%1)*60)).padStart(2,'0')}
function legPrice(L){return L.dyn?Math.round(L.p*DATES[S.g.date].f/1000)*1000:L.p}
function isNight(dep,dur){const d=((dep%24)+24)%24;return dur>=4&&(d>=19||d+dur>=26)} // chỉ chặng dài phải ngủ trên xe/tàu
function nextDep(L,after){let best=null;for(let k=Math.floor(after/24)-1;k<=Math.floor(after/24)+2;k++)for(const t of L.deps){const a=k*24+t;if(a>=after&&(best===null||a<best))best=a}return best}
function outbound(origin,hub){const res=[];
  for(const L1 of LEGS.filter(l=>l.f===origin)){
    const seconds=L1.t===hub?[null]:LEGS.filter(l=>l.f===L1.t&&l.t===hub);
    for(const L2 of seconds){ for(const t of L1.deps){
      for(let shift=0;shift<=2;shift++){const d1=t-24*shift,a1=d1+L1.dur;let legs=[{L:L1,dep:d1,arr:a1}],arr=a1;
        if(L2){const d2=nextDep(L2,a1+1.5);if(d2===null)break;legs.push({L:L2,dep:d2,arr:d2+L2.dur});arr=d2+L2.dur}
        const fin=arr+DEST[S.g.d].last.dur; if(fin<=23&&fin>=0){res.push({legs,start:d1,end:fin,shift});break}}}}}
  return res}
function inbound(hub,origin){const res=[],N=DEST[S.g.d].nights*24;
  for(const L1 of LEGS.filter(l=>l.f===hub)){
    const seconds=L1.t===origin?[null]:LEGS.filter(l=>l.f===L1.t&&l.t===origin);
    for(const L2 of seconds){for(const t of L1.deps){const d1=N+t;if(t<DEST[S.g.d].leaveAfter)continue;
      let legs=[{L:L1,dep:d1,arr:d1+L1.dur}],arr=d1+L1.dur;
      if(L2){const d2=nextDep(L2,arr+1.5);if(d2===null)continue;legs.push({L:L2,dep:d2,arr:d2+L2.dur});arr=d2+L2.dur}
      res.push({legs,start:d1-DEST[S.g.d].last.dur,end:arr})}}}
  return res}
function stayLeft(st){const date=dayLabel(0);if(st.src==='own'){const v=INV[st.id];if(!v)return 9;if(v.stop[date])return 0;return Math.max(0,v.cap-(v.booked[date]||0))}
  return (st.out||[]).includes(S.g.date)?0:5}
function stayPrice(st){const adj=INV[st.id]?INV[st.id].adj:0;return Math.round((st.p+adj)*DATES[S.g.date].f/1000)*1000}
function plan(){
  const g=S.g,D=DEST[g.d],rooms=Math.ceil(g.ppl/2);
  const outs=outbound(g.origin,D.hub).filter(o=>!(g.noNight&&o.legs.some(x=>isNight(x.dep,x.L.dur))));
  const backs=inbound(D.hub,g.origin).filter(o=>!(g.noNight&&o.legs.some(x=>isNight(x.dep,x.L.dur))));
  const stays=D.stays.filter(s=>stayLeft(s)>=rooms);
  const combos=[];
  for(const o of outs)for(const b of backs)for(const st of stays){
    const tix=[...o.legs,...b.legs].reduce((s,x)=>s+legPrice(x.L),0)*g.ppl;
    const room=stayPrice(st)*rooms*D.nights;
    const app=tix+room, per=app/g.ppl;
    const hours=(o.end-o.start)+(b.end-b.start);
    const comfort=[...o.legs,...b.legs].reduce((s,x)=>s+(x.L.m==='Máy bay'?0:x.L.m==='Limousine'?1:x.L.m.startsWith('Tàu')?2:3),0)+(isNightAny(o,b)?2:0);
    combos.push({o,b,st,tix,room,app,per,hours,comfort,sig:sig(o)+'|'+sig(b)+'|'+st.id})}
  const within=combos.filter(c=>c.per<=g.budget);
  const posterWithin=within.filter(c=>c.st.poster); // ưu tiên đúng chỗ ở trong lộ trình nếu còn phòng và vừa ngân sách
  const pool=posterWithin.length?posterWithin:within.length?within:combos;
  if(!pool.length)return {plans:[],within:false,reason:outs.length?(backs.length?'no-stay':'no-back'):'no-out'};
  const minC=Math.min(...pool.map(c=>c.per)),maxC=Math.max(...pool.map(c=>c.per)),minH=Math.min(...pool.map(c=>c.hours)),maxH=Math.max(...pool.map(c=>c.hours));
  const n=(v,a,b)=>b>a?(v-a)/(b-a):0;
  const posterBonus=c=>c.st.poster?-0.08:0;
  const by=(f)=>[...pool].sort((a,b)=>f(a)-f(b))[0];
  const cheap=by(c=>c.per+c.comfort*1000);
  const fast=by(c=>c.hours*1e6+c.per);
  const bal=by(c=>n(c.per,minC,maxC)*(g.pref==='cheap'?0.7:g.pref==='fast'?0.3:0.5)+n(c.hours,minH,maxH)*(g.pref==='cheap'?0.3:g.pref==='fast'?0.7:0.5)+posterBonus(c)+c.comfort*0.02);
  const out=[];const seen=new Set();
  for(const [k,c] of [['Tiết kiệm',cheap],['Cân bằng',bal],['Nhanh',fast]]){if(!seen.has(c.sig)){seen.add(c.sig);out.push({...c,label:k})}}
  const order=g.pref==='cheap'?['Tiết kiệm','Cân bằng','Nhanh']:g.pref==='fast'?['Nhanh','Cân bằng','Tiết kiệm']:['Cân bằng','Tiết kiệm','Nhanh'];
  out.sort((a,b)=>order.indexOf(a.label)-order.indexOf(b.label));
  return {plans:out,within:within.length>0,minPer:Math.min(...combos.map(c=>c.per))}}
function sig(o){return o.legs.map(x=>x.L.m+x.dep).join('>')}
function isNightAny(o,b){return [...o.legs,...b.legs].some(x=>isNight(x.dep,x.L.dur))}

/* ---------- lớp AI (mô phỏng): hiểu câu nói ---------- */
function parseAsk(t){const s=t.toLowerCase(),u=[];const g=S.g;
  const m=s.match(/(\d+[.,]?\d*)\s*(củ|cu|tr|triệu|trieu)/);if(m){g.budget=parseFloat(m[1].replace(',','.'))*1e6;u.push('Ngân sách '+tr(g.budget)+'/người')}
  const p=s.match(/(\d+)\s*(đứa|dua|người|nguoi|ng)/);if(p){g.ppl=Math.min(8,+p[1]);u.push(g.ppl+' người')}
  if(/hà nội|ha noi|hn\b/.test(s)){g.origin='HAN';u.push('Đi từ Hà Nội')} else if(/sài gòn|sai gon|sg\b|hcm/.test(s)){g.origin='SGN';u.push('Đi từ Sài Gòn')} else if(/đà nẵng|da nang|dn\b/.test(s)){g.origin='DAD';u.push('Đi từ Đà Nẵng')}
  if(/không.*đêm|k.*đêm|khong.*dem|ko.*dem/.test(s)){g.noNight=true;u.push('Tránh đi đêm')}
  if(/rẻ|re nhat|tiết kiệm|tiet kiem/.test(s)){g.pref='cheap';u.push('Ưu tiên rẻ')}
  if(/nhanh|ít mệt|it met|đỡ mệt/.test(s)){g.pref='fast';u.push('Ưu tiên nhanh, ít mệt')}
  if(!u.length)u.push('Chưa rõ ý. Thử: "2 đứa, 3 củ mỗi người, không đi xe đêm"');
  g.understood=u}

function openGo(r){S.g={r,d:ROUTES[r].dest,origin:'SGN',date:1,ppl:2,budget:5000000,pref:'bal',noNight:false,ask:'',understood:[],steps:[],planning:false,res:null,sel:0,stay:null};S.page='go';runPlan()}
function setG(k,v){S.g[k]=v;S.g.stay=null;runPlan()}
function runPlan(){const g=S.g;g.planning=true;g.res=null;g.sel=0;const D=DEST[g.d],R=ROUTES[g.r];
  const nPts=R.days.flat().length;
  const steps=[`Đọc lộ trình: ${R.days.length} ngày, ${nPts} điểm, ở ${D.nights} đêm`,
   `Tìm chặng đi từ ${CITY[g.origin]} tới ${D.name}`,
   `Kiểm tra phòng trống ngày ${dayLabel(0)} cho ${Math.ceil(g.ppl/2)} phòng`,
   `Lọc theo ngân sách ${tr(g.budget)}/người${g.noNight?', tránh đi đêm':''}`,
   'Chọn 3 phương án'];
  g.steps=[];S.keepScroll=true;render();let i=0;const key=Math.random();g.key=key;
  const tick=()=>{if(S.page!=='go'||g.key!==key)return;if(i<steps.length){g.steps.push(steps[i++]);S.keepScroll=true;render();setTimeout(tick,260)}
    else{g.res=plan();g.planning=false;S.keepScroll=true;render()}};setTimeout(tick,200)}
function legRow(x){return `<div class="it"><span class="t">${dayLabel(x.dep)}<br>${hh(x.dep)}</span><span class="s">${x.L.m}<div class="note">${CITY[x.L.f]} → ${CITY[x.L.t]} · đến ${hh(x.arr)}${Math.floor(x.arr/24)!==Math.floor(x.dep/24)?' ('+dayLabel(x.arr)+')':''}${isNight(x.dep,x.L.dur)?' · đi đêm':''}</div>${srcTag(x.L.src)}</span><span class="sm">${VND(legPrice(x.L))}</span></div>`}
function howTo(km){if(km<1)return `Đi bộ ${Math.round(km*12)+3} phút`;if(km<5)return `Xe ôm / xe máy thuê ~${Math.round(km*4)+5} phút · ~${VND(Math.round((km*12000+10000)/1000)*1000)}`;
  return `Taxi ~${Math.round(km*2.5)+5} phút · ~${VND(Math.round((km*15000+20000)/1000)*1000)}`}
function go(){const g=S.g,D=DEST[g.d],R=ROUTES[g.r];const rooms=Math.ceil(g.ppl/2);
  const res=g.res;let pl=res&&res.plans[g.sel];
  if(pl&&g.stay){const st=D.stays.find(s=>s.id===g.stay);if(st&&stayLeft(st)>=rooms){const room=stayPrice(st)*rooms*D.nights;pl={...pl,st,room,app:pl.tix+room,per:(pl.tix+room)/g.ppl}}}
  const budgets=[2000000,3500000,5000000,99000000];
  const tips=R.days.flatMap((d,i)=>d.filter(x=>x.t==='eat'||x.t==='play').map(x=>({...x,day:i})));
  const outside=pl?D.last.est*2*g.ppl:0;
  let main='';
  if(g.planning)main=`<div class="card">${g.steps.map(s=>`<div class="line sm"><span>${s}</span><span class="ok">✓</span></div>`).join('')}<div class="skel"></div></div>`;
  else if(!res.plans.length)main=`<div class="alert">${res.reason==='no-out'?`Chưa tìm được chặng đi từ ${CITY[g.origin]} tới ${D.name} kịp nhận phòng ngày ${dayLabel(0)}.`:res.reason==='no-back'?'Chưa có chặng về phù hợp với điều kiện của bạn.':'Ngày này các chỗ ở đều hết phòng cho số người của bạn.'}
     <div class="acts"><button onclick="setG('date',${(g.date+1)%4})">Thử ngày khác</button>${g.noNight?`<button onclick="setG('noNight',false)">Cho phép đi đêm</button>`:''}${g.origin!=='SGN'?`<button onclick="setG('origin','SGN')">Đi từ Sài Gòn</button>`:''}</div></div>`;
  else{
    main=(res.within?'':`<div class="alert">Không có phương án nào dưới ${tr(g.budget)}/người. Rẻ nhất là ~${tr(res.minPer)}/người.<div class="acts"><button onclick="setG('budget',${Math.ceil(res.minPer/500000)*500000})">Nâng ngân sách lên ${tr(Math.ceil(res.minPer/500000)*500000)}</button></div></div>`)

      <div class="it"><span class="t">${hh(pl.o.end-D.last.dur)}</span><span class="s">${D.last.m}<div class="note">~${VND(D.last.est)}/người · trả tại chỗ</div>${srcTag('tip')}</span></div>
     <div class="dh">Ở ${D.nights} đêm · từ ${dayLabel(0)}</div>
      ${D.stays.map(st=>{const left=stayLeft(st),ok=left>=rooms,on=pl.st.id===st.id;return `<div class="card ${ok?'':'off'}" style="${on?'outline:1px solid #fff':''};cursor:pointer" onclick="${ok?`S.g.stay='${st.id}';S.keepScroll=true;render()`:''}">

  }

    <div class="row" style="align-items:flex-start"><div class="chips" style="flex:1">${DATES.map((d,i)=>`<button class="chip ${g.date===i?'on':''}" onclick="setG('date',${i})">T7 ${d.l}<small>${d.f<0.9?'Rẻ':d.f>1.1?'Cao':'TB'}</small></button>`).join('')}</div>
      <div class="step" style="padding-left:6px"><button onclick="setG('ppl',Math.max(1,S.g.ppl-1))">−</button><b>${g.ppl}</b><button onclick="setG('ppl',Math.min(8,S.g.ppl+1))">+</button></div></div>
    <div class="lbl">Ngân sách mỗi người (vé + chỗ ở)</div>
    <div class="chips">${budgets.map(b=>`<button class="chip ${g.budget===b?'on':''}" onclick="setG('budget',${b})">${b>9e7?'Không giới hạn':tr(b)}</button>`).join('')}${!budgets.includes(g.budget)?`<button class="chip on">${tr(g.budget)}</button>`:''}</div>
    <div class="row" style="margin-top:10px"><div class="seg" style="flex:1">${[['cheap','Rẻ'],['bal','Cân bằng'],['fast','Nhanh']].map(([k,t])=>`<button class="${g.pref===k?'on':''}" onclick="setG('pref','${k}')">${t}</button>`).join('')}</div>
      <div class="row xs" style="gap:6px"><span class="mu">Tránh đi đêm</span><div class="tog ${g.noNight?'on':''}" onclick="setG('noNight',${!g.noNight})"></div></div></div>
    <div class="card" style="margin-top:12px"><div class="xs mu" style="margin-bottom:6px">Hoặc nói theo cách của bạn</div>
      <div class="row"><input type="text" id="ask" placeholder="vd: 2 đứa, 3 củ mỗi người, không đi xe đêm" value="${g.ask.replace(/"/g,'&quot;')}"><button class="mini" style="padding:12px" onclick="S.g.ask=$('#ask').value;parseAsk(S.g.ask);S.g.stay=null;runPlan()">Gửi</button></div>
      ${g.understood.length?`<div class="xs" style="margin-top:8px"><span class="bl">AI hiểu:</span> ${g.understood.join(' · ')}</div>`:''}
      <div class="xs mu" style="margin-top:4px">AI chỉ hiểu yêu cầu và giải thích; giờ, giá, chỗ trống do bộ luật tính từ dữ liệu thật.</div></div>
    ${main}</div>
   <div class="foot">${pl&&!g.planning?`<div class="row" style="margin-bottom:2px"><span class="mu sm">Trả trong app · ${g.ppl} người</span><span class="tot">${VND(pl.app)}</span></div>
     <div class="row xs mu" style="margin-bottom:8px"><span>≈ ${VND(pl.per)}/người · ngoài app dự kiến ~${VND(outside)}</span><span>${pl.per<=g.budget?'<span class="ok">Trong ngân sách</span>':'<span class="wa">Vượt ngân sách</span>'}</span></div>`:''}
    <button class="big btn-ac" ${pl&&!g.planning?'':'disabled'} onclick="goPay()">Đặt ngay</button></div></div>`}

/* ---------- thanh toán ---------- */
function pay(){const u=new Date(Date.now()+600000),t=String(u.getHours()).padStart(2,'0')+':'+String(u.getMinutes()).padStart(2,'0');
  const total=S.cart.reduce((s,c)=>s+c.total,0);const ownStay=S.cart.find(c=>c.stay&&c.src==='own');const cod=S.payModel==='cod'&&ownStay?ownStay.total:0;
  return `<div class="page"><div class="hdr"><button class="back" onclick="S.page='go';render()">‹</button><div class="ti">Thanh toán</div></div>
   <div class="body"><div class="card sm">Vé và phòng được giữ đến <b>${t}</b></div>
    <div class="card">${S.cart.map(c=>`<div class="line"><span>${c.name}<div class="xs mu">${c.sub}</div>${srcTag(c.src)}</span><span>${VND(c.total)}</span></div>`).join('')}
     <div class="hr"></div><div class="line b"><span>Tổng</span><span>${VND(total)}</span></div></div>
    ${ownStay?`<div class="lbl">Trả tiền phòng ${ownStay.name}</div><div class="seg"><button class="${S.payModel==='app'?'on':''}" onclick="S.payModel='app';render()">Trả trước trong app</button><button class="${S.payModel==='cod'?'on':''}" onclick="S.payModel='cod';render()">Trả tại homestay</button></div>`:''}
    <div class="lbl">Phương thức</div><div class="seg"><button class="on">QR ngân hàng</button><button>Thẻ</button><button>Ví</button></div>
    ${S.payLog.length?`<div class="card sm" style="margin-top:12px">${S.payLog.map(l=>`<div class="line"><span>${l}</span><span class="ok">✓</span></div>`).join('')}</div>`:''}</div>
   <div class="foot">${cod?`<div class="row xs mu" style="margin-bottom:6px"><span>Trả tại homestay khi đến</span><span>${VND(cod)}</span></div>`:''}
    <button class="big btn-ac" ${S.paying?'disabled':''} onclick="doPay()">${S.paying?'Đang xử lý…':'Thanh toán '+VND(total-cod)}</button></div></div>`}
function doPay(){if(S.paying)return;S.paying=true;const steps=['Kiểm tra lại giá và chỗ còn hiệu lực','Giữ vé và phòng','Thanh toán thành công (1 lần, có mã chống trùng)','Đối tác và nhà xe xác nhận'];
  let i=0;S.payLog=[];render();const tick=()=>{if(i<steps.length){S.payLog.push(steps[i++]);render();setTimeout(tick,450)}else finish()};setTimeout(tick,300)}
function finish(){const g=S.g,D=DEST[g.d];const st=S.cart.find(c=>c.stay);
  if(st&&st.src==='own'&&INV[st.stay.id]){const d=dayLabel(0);INV[st.stay.id].booked[d]=(INV[st.stay.id].booked[d]||0)+Math.ceil(g.ppl/2);
    HOSTBOOK.unshift({who:'Nguyễn K. (bạn)',d,n:Math.ceil(g.ppl/2)+' phòng',pay:S.payModel==='cod'?'Trả tại homestay':'Trả trong app',isNew:true})}
  const total=S.cart.reduce((s,c)=>s+c.total,0);
  S.result={title:ROUTES[g.r].title,d:dayLabel(0)+'–'+dayLabel(D.nights*24),ppl:g.ppl,items:S.cart,r:g.r,stay:st.name};
  S.trips.unshift({t:D.name+' · '+S.result.d,s:`${g.ppl} người · ${VND(total)}`,from:'Theo lộ trình của @'+ROUTES[g.r].author});
  S.paying=false;S.page='done';render()}
function done(){const r=S.result;const tips=ROUTES[r.r].days.flatMap(d=>d.filter(x=>x.t==='eat'||x.t==='play'));
  return `<div class="page"><div class="body"><div class="center" style="height:auto;padding-top:36px">
   <div class="check">✓</div><div class="b" style="font-size:20px">Đã đặt xong</div><div class="sm mu" style="margin-top:4px">${r.title} · ${r.d} · ${r.ppl} người</div></div>
   <div class="card" style="margin-top:18px">${r.items.map(i=>`<div class="line"><span>${i.name}<div class="xs mu">${i.sub}</div></span><span class="ok sm">Đã xác nhận</span></div>`).join('')}</div>
   <div class="card"><div class="b sm" style="margin-bottom:4px">Danh sách gợi ý đã lưu vào chuyến</div>${tips.map(x=>`<div class="xs mu">· ${x.name}${x.price?' · '+x.price:''}</div>`).join('')}</div>
   ${r.r==='tx'?`<div class="card xs mu">Chủ homestay đã nhận đơn (nếu chọn Mây Homestay). Xem ở Tôi → Chế độ đối tác.</div>`:''}</div>
   <div class="foot"><button class="big btn-w" onclick="S.page=null;S.g=null;S.tab='trips';render()">Xem chuyến đi</button></div></div>`}

/* ---------- chuyến đi, tôi, đối tác ---------- */
function trips(){return `<div class="page" style="z-index:1"><div class="hdr"><div class="ti" style="margin-right:0">Chuyến đi</div></div><div class="body">
   ${S.trips.map(t=>`<div class="card"><div class="b">${t.t}</div><div class="sm mu">${t.s}</div><div class="xs mu" style="margin-top:4px">${t.from}</div></div>`).join('')||'<div class="sm mu">Chưa có chuyến nào. Lướt video và bấm Đi ngay.</div>'}
   <div class="lbl">Đã lưu</div>${POSTS.filter(p=>S.saved[p.id]).map(p=>`<div class="card sm">${p.cap}<div class="xs mu">@${p.u}</div></div>`).join('')||'<div class="sm mu">Chưa lưu bài nào</div>'}</div></div>`}
function me(){return `<div class="page" style="z-index:1"><div class="hdr"><div class="ti" style="margin-right:0">Tôi</div></div><div class="body">
  <div class="center" style="height:auto;padding:20px 0"><div class="avatar" style="width:72px;height:72px;font-size:24px;margin-bottom:10px">K</div><div class="b">@khang.di</div><div class="sm mu">${S.login?'Đã đăng nhập':'Chưa đăng nhập'}</div></div>
  <div class="card" onclick="S.page='host';render()" style="cursor:pointer"><div class="b">Chế độ đối tác</div><div class="sm mu">Mô phỏng màn hình của chủ Mây Homestay Tà Xùa</div></div></div></div>`}
function host(){const v=INV.may;const dates=['15/11','22/11','29/11','6/12'];
  return `<div class="page"><div class="hdr"><button class="back" onclick="S.page=null;render()">‹</button><div class="ti">Mây Homestay · Đối tác</div></div><div class="body">
   <div class="xs mu">Kho phòng nằm trong hệ thống của nền tảng. Thay đổi ở đây ảnh hưởng ngay đến phương án "Đi ngay".</div>
   <div class="lbl">Phòng trống (${v.cap} phòng view mây)</div>
   <div class="cal">${dates.map(d=>{const left=v.stop[d]?0:Math.max(0,v.cap-(v.booked[d]||0));return `<div><div class="b">${d}</div><div class="${left?'ok':'ac'}">${v.stop[d]?'Ngừng bán':'Còn '+left}</div>
     <button class="mini" style="margin-top:6px" onclick="INV.may.stop['${d}']=!INV.may.stop['${d}'];render()">${v.stop[d]?'Mở bán':'Ngừng'}</button></div>`}).join('')}</div>
   <div class="lbl">Giá mỗi đêm</div><div class="row card"><span class="b">${VND(650000+v.adj)}</span><div class="step"><button onclick="INV.may.adj-=50000;render()">−</button><button onclick="INV.may.adj+=50000;render()">+</button></div></div>
   <div class="lbl">Đơn đặt</div>
   ${HOSTBOOK.map(b=>`<div class="card"><div class="row"><div><div class="b">${b.who}${b.isNew?' <span class="src own">Mới</span>':''}</div><div class="sm mu">Nhận phòng ${b.d} · ${b.n}</div></div><span class="xs mu">${b.pay}</span></div></div>`).join('')}
   <div class="card xs mu">Hoa hồng nền tảng 12% · đối soát cuối tháng (mô phỏng)</div></div></div>`}

/* ---------- đăng bài: dựng lộ trình bằng điểm ---------- */
const EXTRA=[{t:'eat',name:'Cà phê sân mây',price:'40–60k/người'},{t:'play',name:'Đồi chè cổ thụ',price:'Miễn phí'},{t:'eat',name:'Quán cơm lam',price:'50–80k/người'}];
function create(){const st=S.cp.step;
  const head=t=>`<div class="hdr"><button class="back" onclick="${st<=1?"S.page=null":"S.cp.step--"};render()">‹</button><div class="ti">${t}</div></div><div class="dots">${[1,2,3].map(i=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div>`;
  if(st===1)return `<div class="page">${head('Video')}<div class="body">
     <div class="thumb" style="background:linear-gradient(175deg,#495057,#868e96 40%,#dee2e6 75%,#f59f00)"><div class="blurbox ${S.cp.blur?'done':''}" style="left:60px;top:70px"></div><div class="blurbox ${S.cp.blur?'done':''}" style="left:200px;top:90px"></div><div class="lab">0:48</div></div>
     <div class="card sm"><div class="row"><span>2 khuôn mặt người lạ</span><button class="chip ${S.cp.blur?'on':''}" onclick="S.cp.blur=true;render()">${S.cp.blur?'Đã làm mờ':'Làm mờ'}</button></div></div></div>
     <div class="foot"><button class="big btn-ac" ${S.cp.blur?'':'disabled'} onclick="S.cp.step=2;render()">Tiếp</button></div></div>`;
  if(st===2)return `<div class="page">${head('Kể chuyện')}<div class="body"><textarea placeholder="Viết gì đó về chuyến đi…" oninput="S.cp.cap=this.value">${S.cp.cap}</textarea>
     <div class="lbl">Bài này có nhận tài trợ không?</div><div class="seg"><button class="${S.cp.sp===false?'on':''}" onclick="S.cp.sp=false;render()">Không</button><button class="${S.cp.sp===true?'on':''}" onclick="S.cp.sp=true;render()">Có · gắn nhãn Hợp tác</button></div>
     <div class="xs mu" style="margin-top:8px">Không cần chứng minh đã đi. Nội dung có tài trợ bắt buộc gắn nhãn.</div></div>
     <div class="foot"><button class="big btn-ac" ${S.cp.sp===null?'disabled':''} onclick="S.cp.step=3;render()">Tiếp</button></div></div>`;
  const R=ROUTES.tx;const extra=EXTRA.slice(0,S.cp.extra);
  return `<div class="page">${head('Dựng lộ trình')}<div class="body"><div class="xs mu">Chỉ cần các điểm: đi từ đâu đến đâu, ở đâu, chơi đâu, ăn đâu. Người xem bấm Đi ngay, hệ thống tự lên vé xe, máy bay và phòng theo ngân sách của họ.</div>
     ${R.days.map((d,i)=>`<div class="dh">Ngày ${i+1}</div>`+d.map(x=>`<div class="it"><span class="t">${TL[x.t]}</span><span class="s">${x.name}${x.price?` · <span class="mu">${x.price}</span>`:''}${x.note?`<div class="note">${x.note}</div>`:''}</span></div>`).join('')
       +(i===1?extra.map(x=>`<div class="it"><span class="t">${TL[x.t]}</span><span class="s">${x.name} · <span class="mu">${x.price}</span></span></div>`).join(''):'')).join('')}
     <button class="mini" style="margin-top:10px" onclick="S.cp.extra=Math.min(3,S.cp.extra+1);render()">+ Thêm điểm (chơi / ăn / ở / di chuyển)</button></div>
     <div class="foot"><button class="big btn-ac" onclick="S.myPost=true;S.page=null;S.tab='home';render();toast('Đã đăng · đang được kiểm duyệt tự động')">Đăng</button></div></div>`}

render();
</script>
</body>
</html>
